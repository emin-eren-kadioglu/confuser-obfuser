[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "confuser-obfuser"
version = "0.2.0"
description = "A structural Python, C and Go source obfuscator with an interactive terminal UI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Emin Eren Kadioglu" },
]
keywords = ["ast", "c", "cli", "go", "obfuscation", "python", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
confuser = "obfuscator.cli:main"
py-obfuscate = "obfuscator.cli:main"
confuser-obfuser = "obfuscator.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["build>=1.2", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["obfuscator*"]

[tool.setuptools.package-data]
obfuscator = ["go_ast_helper/*.go"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
